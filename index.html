<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyon S | Instructional Designer</title>
</head>
<body style="margin:0;background:#110d36;color:#f4f1ff;font:16px sans-serif;display:grid;min-height:100vh;place-items:center">
  <p id="status">Loading Reyon’s portfolio…</p>
  <script>
    (function(){
      var source='https://raw.githubusercontent.com/R-Raysh/reyon.s/fae7e1ed15211c1c54fdb140dfa5d450cc2b77c0/index.html';
      fetch(source).then(function(response){
        if(!response.ok)throw Error('Could not load the original portfolio.');
        return response.text();
      }).then(function(html){
        document.open();
        document.write(html);
        document.close();
      }).catch(function(error){
        document.getElementById('status').textContent='The portfolio could not be loaded. Please refresh the page.';
        console.error(error);
      });
    }());
  </script>
</body>
</html>
