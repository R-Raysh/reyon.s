<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reyon S | Instructional Designer</title>
</head>
<body style="margin:0;background:#110d36;color:#f4f1ff;font:16px sans-serif;display:grid;min-height:100vh;place-items:center">
  <p id="status">Loading Reyon’s portfolio…</p>
  <script>
    (function(){
      var source='https://raw.githubusercontent.com/R-Raysh/reyon.s/fae7e1ed15211c1c54fdb140dfa5d450cc2b77c0/index.html';
      fetch(source).then(function(response){if(!response.ok)throw Error('Could not load the original portfolio.');return response.text()}).then(function(html){
        var oldPortrait='<div class="portrait" id="portrait"><img class="char-img" alt="Illustrated portrait of Reyon S" hidden></div>';
        var videoPortrait='<div class="portrait" id="portrait"><video id="heroVideo" muted playsinline preload="metadata" aria-label="Animated 3D character"><source src="https://raw.githubusercontent.com/R-Raysh/reyon.s/main/3D_woman_walks_and_smiles_2859d3f7_376c9824.mp4" type="video/mp4"></video></div>';
        if(html.indexOf(oldPortrait)===-1)throw Error('Could not find the original hero character to replace.');
        html=html.replace(oldPortrait,videoPortrait);
        html=html.replace('</head>','<style>#heroVideo{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 16px 30px #09051c99)}</style></head>');
        var scrub='<script>(function(){var video=document.getElementById("heroVideo"),hero=document.querySelector(".hero"),busy=false;function clamp(n){return Math.max(0,Math.min(1,n))}function sync(){busy=false;if(!video||!hero||!isFinite(video.duration)||!video.duration)return;var length=hero.offsetHeight-innerHeight,p=length>0?clamp(-hero.getBoundingClientRect().top/length):0,frame=clamp(p/.78)*video.duration;if(Math.abs(video.currentTime-frame)>.08)try{video.currentTime=frame}catch(e){}}function request(){if(!busy){busy=true;requestAnimationFrame(sync)}}video.addEventListener("loadedmetadata",sync);window.addEventListener("scroll",request,{passive:true});window.addEventListener("resize",request);sync()})()<\\/script>';
        html=html.replace('</body>',scrub+'</body>');
        document.open();document.write(html);document.close();
      }).catch(function(error){document.getElementById('status').textContent='The portfolio could not be loaded. Please refresh the page.';console.error(error)});
    }());
  </script>
</body>
</html>
